image:
  repository: letsgodevacr12345.azurecr.io/lets-go
  tag: bootstrap
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  port: 8080
  service:
    type: LoadBalancer
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image: postgres:17
  serviceName: postgres
  port: 5432
  secretName: lets-go-postgres
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
